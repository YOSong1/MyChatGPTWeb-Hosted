# Windows·macOS(arm64, x64) 실행 파일을 GitHub 러너에서 빌드한다. plan2 5.3절.
# 실행: GitHub 저장소 > Actions > "Build executables" > Run workflow
# 산출물: 실행 페이지 하단 Artifacts에서 zip 다운로드 -> Google Drive에 업로드

name: Build executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (파일 이름에 붙음)"
        required: true
        default: "1.0.0"
      onefile:
        description: "단일 파일(onefile)도 함께 빌드"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest      # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel    # Intel (macos-13 러너는 퇴역해 대기열에서 영원히 기다린다)
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      # ---------- Windows ----------
      - name: Build (Windows, onedir)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build_win.ps1 -Version "${{ inputs.version }}"

      - name: Build (Windows, onefile)
        if: runner.os == 'Windows' && inputs.onefile
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build_win.ps1 -Version "${{ inputs.version }}" -OneFile

      # ---------- macOS ----------
      - name: Build (macOS, .app)
        if: runner.os == 'macOS'
        env:
          MCW_VERSION: ${{ inputs.version }}
        run: bash build/build_mac.sh

      - name: Build (macOS, onefile)
        if: runner.os == 'macOS' && inputs.onefile
        env:
          MCW_VERSION: ${{ inputs.version }}
          MCW_ONEFILE: "1"
        run: bash build/build_mac.sh

      # ---------- 실행 확인 ----------
      # --selftest: 번들 내부에서 화면 스크립트를 실제로 실행해 키 화면과 오류 문구까지 확인한다.
      - name: Self test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\MyChatGPTWeb\MyChatGPTWeb.exe" --selftest 2>&1 | Select-String -NotMatch "DEBUG|ScriptRunContext"
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }

      - name: Self test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/MyChatGPTWeb.app/Contents/MacOS/MyChatGPTWeb --selftest 2>&1 | grep -vE "DEBUG|ScriptRunContext"
          test "${PIPESTATUS[0]}" = "0"

      # 서버가 실제로 포트를 열고 health 응답을 주는지도 본다.
      - name: Server smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MyChatGPTWeb\MyChatGPTWeb.exe" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest -UseBasicParsing http://localhost:8765/_stcore/health).Content.Trim() -eq "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "server did not start" }
          "server OK"

      - name: Server smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/MyChatGPTWeb.app/Contents/MacOS/MyChatGPTWeb &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs http://localhost:8765/_stcore/health | grep -q ok; then ok=1; break; fi
          done
          kill $PID || true
          [ "$ok" = "1" ] || { echo "server did not start"; exit 1; }
          echo "server OK"

      - uses: actions/upload-artifact@v4
        with:
          name: MyChatGPTWeb-${{ inputs.version }}-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
